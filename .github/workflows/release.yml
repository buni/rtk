name: Release

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag to build from (default: contents of UPSTREAM_REF)"
        required: false
        default: ""
      upstream_repo:
        description: "Upstream repo URL (default: contents of UPSTREAM_REPO)"
        required: false
        default: ""
      version:
        description: "Fork version (default: contents of VERSION)"
        required: false
        default: ""
      prerelease:
        description: "Mark release as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-inputs:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_repo: ${{ steps.resolve.outputs.upstream_repo }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          UPSTREAM_REF="${{ inputs.upstream_ref }}"
          UPSTREAM_REPO="${{ inputs.upstream_repo }}"
          VERSION="${{ inputs.version }}"
          [ -z "$UPSTREAM_REF" ] && UPSTREAM_REF="$(cat UPSTREAM_REF)"
          [ -z "$UPSTREAM_REPO" ] && UPSTREAM_REPO="$(cat UPSTREAM_REPO)"
          [ -z "$VERSION" ] && VERSION="$(cat VERSION)"
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"
          echo "upstream_repo=$UPSTREAM_REPO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: upstream=$UPSTREAM_REPO@$UPSTREAM_REF version=$VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve-inputs
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply patches
        shell: bash
        env:
          UPSTREAM_REMOTE: ${{ needs.resolve-inputs.outputs.upstream_repo }}
        run: scripts/apply-patches.sh build "${{ needs.resolve-inputs.outputs.upstream_ref }}"

      - name: Set Cargo.toml version to fork version
        shell: bash
        working-directory: build
        run: |
          VERSION='${{ needs.resolve-inputs.outputs.version }}'
          # Replace only the first bare `version = "..."` line (the [package]
          # version). Done in Python so behavior is identical across GNU/BSD sed.
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          with open("Cargo.toml") as f:
              text = f.read()
          new, n = re.subn(r'^version = .*', f'version = "{version}"', text, count=1, flags=re.M)
          if n != 1:
              sys.exit("Cargo.toml: no top-level `version = ...` line found")
          with open("Cargo.toml", "w") as f:
              f.write(new)
          PY
          grep '^version = ' Cargo.toml | head -1

      - name: Build
        working-directory: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip
        working-directory: build
        run: strip target/${{ matrix.target }}/release/rtk

      - name: Package
        shell: bash
        working-directory: build
        run: |
          VERSION='${{ needs.resolve-inputs.outputs.version }}'
          NAME="rtk-${VERSION}-${{ matrix.target }}"
          mkdir -p "../dist"
          cp target/${{ matrix.target }}/release/rtk "../dist/${NAME}"
          chmod +x "../dist/${NAME}"
          cd ../dist
          shasum -a 256 "${NAME}" > "${NAME}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve-inputs, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Build release notes
        id: notes
        run: |
          VERSION='${{ needs.resolve-inputs.outputs.version }}'
          UPSTREAM='${{ needs.resolve-inputs.outputs.upstream_ref }}'
          FORK_SHA='${{ github.sha }}'
          {
            echo "**Fork version:** \`$VERSION\`"
            echo ""
            echo "**Upstream base:** \`$UPSTREAM\` ([rtk-ai/rtk@$UPSTREAM](https://github.com/rtk-ai/rtk/releases/tag/$UPSTREAM))"
            echo ""
            echo "**Fork commit:** \`$FORK_SHA\`"
            echo ""
            echo "**Applied patches:**"
            for p in patches/*.patch; do
              SUBJ=$(grep -m1 '^Subject:' "$p" | sed 's/^Subject: \[PATCH\] //')
              echo "- $SUBJ (\`$(basename "$p")\`)"
            done
          } > notes.md
          cat notes.md

      - name: Create tag
        run: |
          VERSION='${{ needs.resolve-inputs.outputs.version }}'
          TAG="v$VERSION"
          git config user.email "fork-release@buni.local"
          git config user.name "fork-release"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          git tag -a "$TAG" -m "Fork release $VERSION"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ needs.resolve-inputs.outputs.version }}'
          PRE=''
          if [ '${{ inputs.prerelease }}' = 'true' ]; then PRE='--prerelease'; fi
          gh release create "v$VERSION" \
            --title "rtk-fork v$VERSION" \
            --notes-file notes.md \
            $PRE \
            dist/*
